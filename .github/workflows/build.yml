name: Cross-Compile FreeBSD 14 amd64 Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang & LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wget tar xz-utils

      - name: Setup FreeBSD 14 Sysroot
        run: |
          mkdir -p /tmp/freebsd-sysroot
          echo "[*] Downloading FreeBSD 14 base..."
          wget -q https://download.freebsd.org/releases/amd64/14.4-RELEASE/base.txz -O /tmp/base.txz
          
          echo "[*] Extracting sysroot headers and libraries..."
          tar -xf /tmp/base.txz -C /tmp/freebsd-sysroot ./usr/include ./usr/lib ./lib
          rm -f /tmp/base.txz

      - name: Cross-Compile PoseaFilter Daemon
        run: |
          cd daemon
          mkdir -p bin
          rm -f bin/build.log bin/poseafilterd
          echo "[*] Running Clang Cross-Compiler..."
          clang --target=x86_64-unknown-freebsd14 \
                --sysroot=/tmp/freebsd-sysroot \
                -fuse-ld=lld \
                -B/tmp/freebsd-sysroot/usr/lib \
                -L/tmp/freebsd-sysroot/usr/lib \
                -L/tmp/freebsd-sysroot/lib \
                -O2 -pthread -lm -Iinclude \
                src/main.c src/cJSON.c src/dns_engine.c src/filter_matcher.c src/bsearch_feed.c src/sni_parser.c src/pf_manager.c src/arp_bsd.c \
                -o bin/poseafilterd
          
          strip bin/poseafilterd
          chmod 755 bin/poseafilterd
          file bin/poseafilterd
          ls -lh bin/poseafilterd

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: poseafilterd-freebsd14-amd64
          path: daemon/bin/poseafilterd

      - name: Commit and Push Binary to Main Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f daemon/bin/build.log 2>/dev/null || true
          git add -f daemon/bin/poseafilterd
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(release): precompiled FreeBSD 14 amd64 binary for pfSense"
            git push origin main
          fi
