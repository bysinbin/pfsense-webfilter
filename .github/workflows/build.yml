name: Cross-Compile FreeBSD 14 amd64 Binary

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang & LLD
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld wget tar xz-utils

      - name: Setup FreeBSD 14 Sysroot
        run: |
          mkdir -p /tmp/freebsd-sysroot
          echo "[*] Downloading FreeBSD 14 base..."
          wget -q https://download.freebsd.org/releases/amd64/14.4-RELEASE/base.txz -O /tmp/base.txz
          
          echo "[*] Extracting sysroot headers and libraries..."
          tar -xf /tmp/base.txz -C /tmp/freebsd-sysroot ./usr/include ./usr/lib ./lib
          rm -f /tmp/base.txz

      - name: Cross-Compile PoseaFilter Daemon
        run: |
          cd daemon
          mkdir -p bin
          echo "[*] Running Clang Cross-Compiler..."
          clang -v --target=x86_64-unknown-freebsd14 \
                --sysroot=/tmp/freebsd-sysroot \
                -fuse-ld=lld \
                -B/tmp/freebsd-sysroot/usr/lib \
                -L/tmp/freebsd-sysroot/usr/lib \
                -L/tmp/freebsd-sysroot/lib \
                -O2 -pthread -Iinclude \
                src/main.c src/cJSON.c src/dns_engine.c src/filter_matcher.c src/bsearch_feed.c src/sni_parser.c src/pf_manager.c src/arp_bsd.c \
                -o bin/poseafilterd > bin/build.log 2>&1 || true
          
          if [ -f "bin/poseafilterd" ]; then
            strip bin/poseafilterd
            chmod 755 bin/poseafilterd
            file bin/poseafilterd
            ls -lh bin/poseafilterd
          else
            echo "[!] Compilation failed. Log contents:"
            cat bin/build.log
          fi

      - name: Commit and Push Binary or Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f daemon/bin/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: compile output update"
            git push origin main
          fi
